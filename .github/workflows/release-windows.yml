name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download bundled Codex CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "resources/codex-cli" | Out-Null
          Push-Location "resources/codex-cli"
          npm pack "@openai/codex@0.147.0"
          npm pack "@openai/codex@0.147.0-win32-x64"
          Pop-Location
          $required = @(
            "resources/codex-cli/openai-codex-0.147.0.tgz",
            "resources/codex-cli/openai-codex-0.147.0-win32-x64.tgz"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing bundled Codex CLI package: $file" }
          }

      - name: Verify version and JavaScript
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version v$version"
          }
          node --check main.js
          node --check preload.js
          node --check renderer.js

      - name: Build Windows installer
        run: npm run dist -- --publish never

      - name: Prepare release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $content = Get-Content -LiteralPath "CHANGELOG.md" -Raw
          $escapedVersion = [regex]::Escape($version)
          $match = [regex]::Match($content, "(?ms)^##\s+$escapedVersion\b.*?(?=^##\s+|\z)")
          if (-not $match.Success) { throw "No CHANGELOG.md entry found for version $version" }
          Set-Content -LiteralPath "release-notes.md" -Value $match.Value.Trim() -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DeepSeek Codex ${{ github.ref_name }}
          body_path: release-notes.md
          make_latest: true
          files: |
            dist/DeepSeek-Codex-Setup-*.exe
            dist/DeepSeek-Codex-Setup-*.exe.blockmap
            dist/latest.yml
