.project-name {

<body>

<div class="app">

  <aside class="sidebar">

    <div class="brand">
      <div class="logo">D</div>
      DeepSeek Codex
    </div>

    <button class="new-task">＋ 新建任务</button>

    <div class="section-title">最近项目</div>

    <div class="project active">
      DeepSeek Codex GUI
    </div>

    <div class="project">
      亚马逊翻新助手
    </div>

    <div class="project">
      广告数据系统
    </div>

    <div class="sidebar-bottom">
      <div>DeepSeek V4 Flash</div>
      <div class="model-small">High reasoning</div>
      <div class="sidebar-orb-status" data-status="idle" title="任务状态">
        <img src="assets/dragonball-four-star.png" alt="四星球任务状态">
      </div>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">
      <div class="project-name">DeepSeek Codex GUI</div>

      <div class="model-pill">
        <span class="dot"></span>
        V4 Flash · High
      </div>
      <div class="topbar-actions">
        <button class="check-update-button" type="button" aria-label="检查更新"><i class="ph ph-arrow-clockwise"></i><span>检查更新</span></button>
        <button class="side-chat-toggle" type="button" aria-label="打开辅助聊天"><i class="ph ph-chat-circle-dots"></i><span>辅助聊天</span></button>
      </div>
    </header>

    <section class="chat">

      <div class="welcome">

        <img class="hero-title-image" src="assets/hero-title-reference-transparent.png" alt="今天想开发什么？">

        <p>
          DeepSeek V4 Flash 已准备就绪。<br>
          选择一个项目，然后告诉 Codex 需要完成的任务。
        </p>

        <div class="quick-grid">

          <button type="button" class="quick" data-prompt="请检查整个项目，分析目录、代码和潜在问题。">
            <span class="quick-icon"><i class="ph ph-folder-open"></i></span>
            <span class="quick-copy">
              <strong>检查整个项目</strong>
              <span>分析目录、代码和潜在问题</span>
            </span>
            <i class="ph ph-caret-right quick-arrow"></i>
          </button>

          <button type="button" class="quick" data-prompt="请检查当前项目并修复 Bug，定位错误并修改相关文件。">
            <span class="quick-icon"><i class="ph ph-wrench"></i></span>
            <span class="quick-copy">
              <strong>修复 Bug</strong>
              <span>定位错误并修改相关文件</span>
            </span>
            <i class="ph ph-caret-right quick-arrow"></i>
          </button>

          <button type="button" class="quick" data-prompt="我想为当前项目增加一个新功能，请先检查现有实现并协助完成开发。">
            <span class="quick-icon"><i class="ph ph-lightning"></i></span>
            <span class="quick-copy">
              <strong>增加新功能</strong>
              <span>描述需求，让 Agent 完成开发</span>
            </span>
            <i class="ph ph-caret-right quick-arrow"></i>
          </button>

          <button type="button" class="quick" data-prompt="请优化当前项目代码，重点检查结构、性能和可维护性。">
            <span class="quick-icon"><i class="ph ph-code"></i></span>
            <span class="quick-copy">
              <strong>优化代码</strong>
              <span>检查结构、性能和可维护性</span>
            </span>
            <i class="ph ph-caret-right quick-arrow"></i>
          </button>

        </div>

      </div>

    </section>

    <aside class="side-chat-panel" aria-label="辅助聊天面板">
      <div class="side-chat-header">
        <div>
          <div class="side-chat-title"><i class="ph ph-sidebar-simple"></i><span>当前任务</span></div>

        </div>
        <button class="side-chat-close" type="button" aria-label="收起辅助聊天"><i class="ph ph-caret-right"></i></button>
      </div>
      <div class="side-chat-messages">
        <div class="side-task-overview"></div>
        <div class="side-task-section side-task-status"></div>
        <div class="side-task-section side-task-steps"></div>
        <div class="side-task-section side-task-files"></div>
        <div class="side-task-section side-task-approvals"></div>
        <div class="side-task-section side-task-usage"></div>
      </div>
      <form class="side-chat-form">
        <textarea class="side-chat-input" placeholder="追问当前任务…"></textarea>
        <button class="side-chat-send" type="submit" aria-label="发送辅助消息"><i class="ph ph-arrow-up"></i></button>
      </form>
    </aside>

    <div class="composer-wrap">

      <div class="composer">

        <textarea placeholder="给 DeepSeek Codex 一个任务…"></textarea>

        <div class="composer-bottom">

          <div class="project-button">
            <i class="ph ph-folder-simple"></i><span>选择项目</span>
          </div>

          <button class="workspace-button" type="button"><i class="ph ph-files"></i> 工作区</button>

          <button class="send" aria-label="发送"><i class="ph ph-arrow-up"></i></button>

        </div>

      </div>

    </div>

</main>

</div>

  </section>
